[package]
name = "rscommit"
version = "0.1.0"
edition = "2024"
description = "CLI agnóstica para validação de Conventional Commits - independente de linguagem"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RafaelQSantos-RQS/rscommit"
homepage = "https://github.com/RafaelQSantos-RQS/rscommit"
readme = "README.md"
keywords = ["git", "conventional-commits", "commitlint", "hook", "cli"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.cargo-binstall]
bins = ["rscommit"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
git-conventional = "1.1.0"
git2 = "0.21.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tracing = "0.1.44"
which = "8.0.6"

[dev-dependencies]
serial_test = "4.0.1"
tempfile = "3.27.0"
