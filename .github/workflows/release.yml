name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rscommit-x86_64-unknown-linux-gnu
            binary_name: rscommit
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: rscommit-x86_64-apple-darwin
            binary_name: rscommit
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rscommit-aarch64-apple-darwin
            binary_name: rscommit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rscommit-x86_64-pc-windows-msvc.exe
            binary_name: rscommit.exe
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} artifact/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifact/${{ matrix.artifact }}

  checksum:
    name: Generate checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rscommit-*
          merge-multiple: true
          path: artifacts/

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt

  release:
    name: Create GitHub Release
    needs: [build, checksum]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rscommit-*
          merge-multiple: true
          path: artifacts/

      - name: Download checksums
        uses: actions/download-artifact@v8
        with:
          name: checksums
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
